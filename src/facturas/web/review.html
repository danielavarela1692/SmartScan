<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Facturas pendientes — SmartScan</title>
<style>
  :root {
    --paper: #FFFFFF;
    --paper-2: #F7F5F1;
    --ink: #2A2722;
    --ink-soft: #6F6A5E;
    --line: #E3DFD6;
    --sidebar-bg: #38352E;
    --sidebar-ink: #EDEAE2;
    --sidebar-ink-soft: #A6A093;
    --sidebar-active: #46423A;
    --accent: #C1432E;
    --accent-soft: #F6E4DF;
    --good: #5C7A52;
    --good-soft: #EBF0E6;
    --warn: #A97328;
    --warn-soft: #F5EAD9;
    --bad: #8C2F2A;
    --bad-soft: #F1E1DE;
    --radius: 12px;
    --radius-sm: 8px;
    --shadow: 0 1px 2px rgba(42,39,34,.08), 0 2px 8px rgba(42,39,34,.06);
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --font-mono: ui-monospace, "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #211F1B; --paper-2: #2A2822; --ink: #EEEAE2; --ink-soft: #A6A093;
      --line: #423E36; --sidebar-bg: #17150F; --sidebar-active: #29261F;
      --accent: #E0725D; --accent-soft: #3D2621;
      --good: #8FAE84; --good-soft: #26301F; --warn: #D9A75C; --warn-soft: #3A2E17;
      --bad: #D98B82; --bad-soft: #3B211D;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 2px 8px rgba(0,0,0,.3);
    }
  }
  :root[data-theme="dark"] {
    --paper: #211F1B; --paper-2: #2A2822; --ink: #EEEAE2; --ink-soft: #A6A093;
    --line: #423E36; --sidebar-bg: #17150F; --sidebar-active: #29261F;
    --accent: #E0725D; --accent-soft: #3D2621;
    --good: #8FAE84; --good-soft: #26301F; --warn: #D9A75C; --warn-soft: #3A2E17;
    --bad: #D98B82; --bad-soft: #3B211D;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 2px 8px rgba(0,0,0,.3);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--paper-2); color: var(--ink); font-family: var(--font); }

  .shell { display: grid; grid-template-columns: 216px 1fr; height: 100vh; }
  .shell.collapsed { grid-template-columns: 64px 1fr; }

  .sidebar { background: var(--sidebar-bg); color: var(--sidebar-ink); padding: 16px 12px; display: flex; flex-direction: column; overflow: hidden; }
  .brand-row { display: flex; align-items: center; gap: 10px; padding: 4px 6px 20px; }
  .brand-row .mark { width: 30px; height: 30px; border-radius: 8px; background: var(--accent); display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 15px; color: white; flex-shrink: 0; }
  .brand-row .name { font-size: 14.5px; font-weight: 700; letter-spacing: -0.01em; white-space: nowrap; }
  .hamburger { background: none; border: none; color: var(--sidebar-ink-soft); cursor: pointer; padding: 6px; margin-left: auto; flex-shrink: 0; font-size: 15px; }
  .hamburger:hover { color: var(--sidebar-ink); }
  .shell.collapsed .brand-row .name, .shell.collapsed .nav-item .label, .shell.collapsed .nav-item .count { display: none; }
  .shell.collapsed .brand-row { justify-content: center; padding: 4px 0 20px; }
  .shell.collapsed .hamburger { margin: 0; }

  a.nav-item, .nav-item { display: flex; align-items: center; gap: 11px; padding: 9px 10px; border-radius: var(--radius-sm); font-size: 13.5px; color: var(--sidebar-ink-soft); cursor: pointer; margin-bottom: 2px; text-decoration: none; white-space: nowrap; }
  .nav-item .ic { width: 18px; text-align: center; flex-shrink: 0; }
  .nav-item.active { background: var(--sidebar-active); color: var(--sidebar-ink); font-weight: 600; }
  .nav-item .count { margin-left: auto; background: var(--accent); color: white; font-size: 10.5px; font-weight: 700; padding: 1px 7px; border-radius: 9px; }
  .nav-item:hover:not(.active) { color: var(--sidebar-ink); }
  .sidebar-foot { margin-top: auto; padding: 10px 10px 0; font-size: 11.5px; color: var(--sidebar-ink-soft); border-top: 1px solid rgba(255,255,255,.08); padding-top: 14px; white-space: nowrap; overflow: hidden; }

  .main { display: flex; flex-direction: column; min-width: 0; }
  .topbar { display: flex; align-items: center; justify-content: space-between; padding: 16px 24px; border-bottom: 1px solid var(--line); background: var(--paper); flex-shrink: 0; }
  .topbar h1 { font-size: 17px; margin: 0; }
  .topbar button.refresh { background: var(--paper-2); color: var(--ink-soft); border: 1px solid var(--line); padding: 7px 14px; border-radius: 20px; font-size: 12.5px; font-weight: 600; cursor: pointer; }

  .body { display: grid; grid-template-columns: 300px 1fr; flex: 1; min-height: 0; }
  .list-col { border-right: 1px solid var(--line); overflow-y: auto; padding: 14px 10px; background: var(--paper); }
  .list-empty { color: var(--ink-soft); font-size: 13px; padding: 24px 14px; text-align: center; }
  .doc-row { padding: 12px 12px; border-radius: var(--radius-sm); cursor: pointer; margin-bottom: 3px; border: 1px solid transparent; }
  .doc-row:hover { background: var(--paper-2); }
  .doc-row.active { background: var(--accent-soft); border-color: var(--accent); }
  .doc-row .prov { font-weight: 600; font-size: 13.5px; margin-bottom: 3px; }
  .doc-row .meta { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .doc-row .amt { font-size: 12px; color: var(--ink-soft); font-family: var(--font-mono); }

  .pill { display: inline-flex; align-items: center; gap: 5px; font-size: 10.5px; font-weight: 700; padding: 2px 9px; border-radius: 10px; white-space: nowrap; }
  .pill.ok { background: var(--good-soft); color: var(--good); }
  .pill.pending { background: var(--warn-soft); color: var(--warn); }
  .pill.bad { background: var(--bad-soft); color: var(--bad); }

  .detail-col { overflow-y: auto; padding: 22px 28px; }
  .placeholder { color: var(--ink-soft); font-size: 14px; padding: 60px; text-align: center; }

  .detail-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 18px; flex-wrap: wrap; }
  .detail-head h2 { font-size: 16.5px; margin: 0; word-break: break-word; }

  .detail-panel { display: grid; grid-template-columns: minmax(0,1.1fr) minmax(0,1fr); gap: 22px; align-items: start; }
  .pdf-col { display: flex; flex-direction: column; gap: 8px; position: sticky; top: 0; }
  .pdf-open-link { font-size: 12px; color: var(--accent); text-decoration: none; font-weight: 600; }
  .pdf-open-link:hover { text-decoration: underline; }
  .pdf-box { background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; height: 74vh; box-shadow: var(--shadow); }
  .pdf-box embed { width: 100%; height: 100%; border: none; }

  .form-card { background: var(--paper); border-radius: var(--radius); box-shadow: var(--shadow); padding: 18px 20px; margin-bottom: 16px; }
  .form-card h3 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--ink-soft); margin: 0 0 14px; }
  .header-note { background: var(--warn-soft); color: var(--warn); border-radius: var(--radius-sm); padding: 10px 14px; font-size: 12.5px; margin-bottom: 14px; }
  .field-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .field { display: flex; flex-direction: column; gap: 5px; }
  .field label { font-size: 11.5px; color: var(--ink-soft); }
  .field input { border: 1px solid var(--line); border-radius: 6px; padding: 9px 10px; font-size: 13.5px; font-family: var(--font); background: var(--paper); color: var(--ink); }
  .field input:focus { outline: none; border-color: var(--accent); }
  .field.missing input { border-color: var(--warn); background: var(--warn-soft); }
  .save-row { display: flex; justify-content: flex-end; margin-top: 12px; }
  .btn { border: none; border-radius: 20px; font-size: 13px; font-weight: 600; padding: 9px 18px; cursor: pointer; font-family: var(--font); }
  .btn.primary { background: var(--accent); color: white; }
  .btn.primary:disabled { background: var(--line); color: var(--ink-soft); cursor: not-allowed; }
  .btn.ghost { background: transparent; color: var(--ink-soft); border: 1px solid var(--line); }
  .btn.small { padding: 6px 14px; font-size: 12px; }

  .item-row { border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 12px 14px; margin-bottom: 10px; }
  .item-row.resolved { border-color: var(--good); background: var(--good-soft); }
  .item-row .detail { font-weight: 600; font-size: 13px; margin-bottom: 4px; }
  .item-row .meta { font-size: 11.5px; color: var(--ink-soft); margin-bottom: 8px; }
  .item-row .resolved-tag { font-size: 12.5px; color: var(--good); font-weight: 600; }
  .item-row select { width: 100%; padding: 8px; border-radius: 6px; border: 1px solid var(--line); font-size: 13px; font-family: var(--font); background: var(--paper); color: var(--ink); }

  .approve-btn { width: 100%; padding: 13px; font-size: 14px; }

  .error-banner { background: var(--bad-soft); color: var(--bad); border-radius: var(--radius-sm); padding: 16px; font-size: 13.5px; }
</style>
</head>
<body>
  <div class="shell" id="shell">
    <div class="sidebar">
      <div class="brand-row">
        <div class="mark">S</div>
        <div class="name">SmartScan</div>
        <button class="hamburger" onclick="document.getElementById('shell').classList.toggle('collapsed')" title="Contraer menú">☰</button>
      </div>
      <a class="nav-item" href="/"><span class="ic">⌂</span><span class="label">Inicio</span></a>
      <a class="nav-item active" href="/panel"><span class="ic">▤</span><span class="label">Facturas pendientes</span><span class="count" id="navCount">0</span></a>
      <a class="nav-item" href="/aprobadas"><span class="ic">✓</span><span class="label">Aprobadas</span></a>
      <div class="sidebar-foot">Gauss Sistemas<br>Cuenta: Producción</div>
    </div>

    <div class="main">
      <div class="topbar">
        <h1>Facturas pendientes</h1>
        <button class="refresh" onclick="loadDocuments()">Actualizar</button>
      </div>
      <div class="body">
        <div class="list-col" id="listCol"></div>
        <div class="detail-col" id="detailCol"><div class="placeholder">Elegí una factura de la izquierda</div></div>
      </div>
    </div>
  </div>

<script>
let documents = [];
let selectedFilename = null;
let loadedPdfFor = null;

async function loadDocuments() {
  const res = await fetch('/api/documents');
  documents = await res.json();
  document.getElementById('navCount').textContent = documents.length;
  renderList();
  if (selectedFilename && !documents.find(d => d.filename === selectedFilename)) {
    selectedFilename = null;
  }
  if (!selectedFilename && documents.length > 0) {
    selectedFilename = documents[0].filename;
  }
  renderDetail();
}

function statusPill(doc) {
  if (doc.errors && doc.errors.length > 0 && !doc.needs_header) return '<span class="pill bad">Error</span>';
  if (doc.needs_header) return '<span class="pill bad">Faltan datos</span>';
  if (doc.all_resolved) return '<span class="pill ok">Resuelta</span>';
  const pending = doc.items.filter(i => !i.resolved).length;
  return `<span class="pill pending">${pending} pendiente(s)</span>`;
}

function renderList() {
  const el = document.getElementById('listCol');
  if (documents.length === 0) {
    el.innerHTML = '<div class="list-empty">No hay facturas pendientes en ./inbox</div>';
    return;
  }
  el.innerHTML = documents.map(doc => {
    const active = doc.filename === selectedFilename ? 'active' : '';
    const total = (doc.total !== null && doc.total !== undefined) ? `$${doc.total.toFixed(2)}` : '—';
    return `<div class="doc-row ${active}" onclick="selectDoc('${doc.filename.replace(/'/g, "\\'")}')">
      <div class="prov">${doc.name || doc.filename}</div>
      <div class="meta"><span class="amt">${total}</span>${statusPill(doc)}</div>
    </div>`;
  }).join('');
}

function selectDoc(filename) {
  selectedFilename = filename;
  renderList();
  renderDetail();
}

function renderDetail() {
  const el = document.getElementById('detailCol');
  const doc = documents.find(d => d.filename === selectedFilename);

  if (!doc) {
    el.innerHTML = '<div class="placeholder">Elegí una factura de la izquierda</div>';
    loadedPdfFor = null;
    return;
  }

  if (doc.errors && doc.errors.length > 0 && !doc.needs_header) {
    el.innerHTML = `<div class="error-banner"><strong>${doc.filename}</strong> no se pudo leer:<br>${doc.errors.join('; ')}</div>`;
    loadedPdfFor = null;
    return;
  }

  const pdfUrl = `/api/pdf/${encodeURIComponent(doc.filename)}`;
  const missingCuit = !doc.cuit ? 'missing' : '';
  const missingNumber = !doc.number ? 'missing' : '';
  const headerNote = doc.needs_header
    ? `<div class="header-note">⚠ Faltan datos que la lectura automática no encontró — completalos para poder ver las líneas y aprobar.</div>`
    : '';

  let itemsHtml = '<p style="color:var(--ink-soft); font-size:13px;">Completá CUIT y número para ver las líneas.</p>';
  if (!doc.needs_header) {
    itemsHtml = doc.items.map((item, idx) => {
      if (item.resolved) {
        return `<div class="item-row resolved">
          <div class="detail">${item.detail}</div>
          <div class="meta">cant. ${item.quantity} · $${item.total.toFixed(2)}</div>
          <div class="resolved-tag">✓ Ítem de compra: ${item.concept_id}</div>
        </div>`;
      }
      const options = item.candidates.map((c, i) =>
        `<option value="${c.concept_id}">${c.description}${i === 0 ? ' — sugerido' : ` (${c.score}%)`}</option>`
      ).join('');
      return `<div class="item-row">
        <div class="detail">${item.detail}</div>
        <div class="meta">cant. ${item.quantity} · $${item.total.toFixed(2)} — sin coincidencia exacta</div>
        <select onchange="resolveItem('${doc.cuit}', ${idx}, this.value)">
          <option value="">Elegí un ítem de compra…</option>
          ${options}
        </select>
      </div>`;
    }).join('') || '<p style="color:var(--ink-soft); font-size:13px;">Sin líneas detectadas.</p>';
  }

  el.innerHTML = `
    <div class="detail-head">
      <h2>${doc.name || doc.filename}</h2>
      ${statusPill(doc)}
    </div>
    <div class="detail-panel">
      <div class="pdf-col">
        <a class="pdf-open-link" id="pdfLink" href="#" target="_blank">↗ Abrir la factura en una pestaña nueva</a>
        <div class="pdf-box"><embed id="pdfEmbed" type="application/pdf" /></div>
      </div>
      <div>
        <div class="form-card">
          <h3>Datos generales</h3>
          ${headerNote}
          <div class="field-grid">
            <div class="field ${missingCuit}"><label>CUIT</label><input id="fieldCuit" value="${doc.cuit}"></div>
            <div class="field"><label>Proveedor</label><input id="fieldName" value="${doc.name}"></div>
            <div class="field ${missingNumber}"><label>Número</label><input id="fieldNumber" value="${doc.number}"></div>
            <div class="field"><label>Total</label><input id="fieldTotal" type="number" step="0.01" value="${doc.total ?? ''}"></div>
          </div>
          <div class="save-row"><button class="btn ghost small" onclick="saveHeader('${doc.filename.replace(/'/g, "\\'")}')">Guardar cambios</button></div>
        </div>
        <div class="form-card">
          <h3>Líneas de la factura</h3>
          ${itemsHtml}
        </div>
        <button class="btn primary approve-btn" ${doc.all_resolved ? '' : 'disabled'} onclick="approve('${doc.filename.replace(/'/g, "\\'")}')">
          ${doc.all_resolved ? 'Aprobar y guardar' : 'Resolvé todo lo pendiente para aprobar'}
        </button>
      </div>
    </div>
  `;

  // El <embed> del PDF nunca se recrea via innerHTML de nuevo despues de este
  // punto salvo que cambie el documento - recrearlo en cada re-render hace
  // que el visor de PDF del navegador quede en blanco/negro (Edge sobre todo).
  if (loadedPdfFor !== doc.filename) {
    document.getElementById('pdfLink').href = pdfUrl;
    document.getElementById('pdfEmbed').src = pdfUrl;
    loadedPdfFor = doc.filename;
  } else {
    document.getElementById('pdfLink').href = pdfUrl;
    document.getElementById('pdfEmbed').src = pdfUrl;
  }
}

async function saveHeader(filename) {
  const cuit = document.getElementById('fieldCuit').value.trim();
  const name = document.getElementById('fieldName').value.trim();
  const number = document.getElementById('fieldNumber').value.trim();
  const totalRaw = document.getElementById('fieldTotal').value.trim();
  const body = { cuit, name, number };
  if (totalRaw !== '') body.total = parseFloat(totalRaw);

  await fetch(`/api/documents/${encodeURIComponent(filename)}/header`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  });
  await loadDocuments();
}

async function resolveItem(cuit, idx, conceptId) {
  if (!conceptId) return;
  const doc = documents.find(d => d.filename === selectedFilename);
  const item = doc.items[idx];
  await fetch('/api/resolve', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ cuit, detail: item.detail, concept_id: conceptId }),
  });
  await loadDocuments();
}

async function approve(filename) {
  const res = await fetch(`/api/approve/${encodeURIComponent(filename)}`, { method: 'POST' });
  if (!res.ok) {
    const err = await res.json();
    alert('No se pudo aprobar: ' + (err.detail || res.statusText));
    return;
  }
  await loadDocuments();
}

loadDocuments();
</script>
</body>
</html>
